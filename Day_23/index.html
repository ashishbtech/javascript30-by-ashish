<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shinobi Synthesizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="voiceinator">
    <h1>Shinobi Voice</h1>

    <select name="voice" id="voices">
      <option value="">Select A Voice</option>
    </select>

    <label for="rate">Rate:</label>
    <input name="rate" type="range" min="0" max="3" value="1" step="0.1">

    <label for="pitch">Pitch:</label>
    <input name="pitch" type="range" min="0" max="2" value="1" step="0.1">

    <textarea name="text">I'm not gonna run away, I never go back on my word! That's my nindo: my ninja way! By the way, Kakashi is definitely my favorite character.</textarea>

    <button id="stop">Stop Jutsu</button>
    <button id="speak">Speak</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
