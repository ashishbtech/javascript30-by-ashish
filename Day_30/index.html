<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflex Tester</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <header class="controls">
      <h1>Score: <span class="score">0</span></h1>
      <button class="start-btn">Start Simulation</button>
    </header>

    <div class="grid">
      <div class="node node1">
        <div class="target"></div>
      </div>
      <div class="node node2">
        <div class="target"></div>
      </div>
      <div class="node node3">
        <div class="target"></div>
      </div>
      <div class="node node4">
        <div class="target"></div>
      </div>
      <div class="node node5">
        <div class="target"></div>
      </div>
      <div class="node node6">
        <div class="target"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
